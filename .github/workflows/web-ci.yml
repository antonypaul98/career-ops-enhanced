name: Web CI

# CI for the experimental web UI (web/). Informative by design: it is NOT a
# required check for the core — a red here never blocks a core merge, and core
# changes never trigger it. The web/ tree versions and releases as its own
# release-please component.
on:
  pull_request:
    paths:
      - 'web/**'
  push:
    branches: [main]
    paths:
      - 'web/**'

permissions:
  contents: read

jobs:
  web:
    name: web typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Dashboard integration tests execute the core engine, whose dependencies
      # resolve from the repository root (separate package, no npm workspace).
      - name: Install core runtime dependencies
        run: npm install --ignore-scripts
        working-directory: .
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build

  daily-http-acceptance:
    name: Daily workflow HTTP acceptance (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_DIST: .next-daily-check
      DAILY_ROUTE_ACCEPTANCE: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install core dependencies without running postinstall
        run: npm install --ignore-scripts
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Install isolated Chromium renderer
        run: npx playwright install chromium --with-deps
      - name: Build production dashboard in isolated dist directory
        run: npm run build
        working-directory: web
      - name: Exercise synthetic daily workflow over production HTTP
        run: npm run test:daily-http-acceptance
        working-directory: web
